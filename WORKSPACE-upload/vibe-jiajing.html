<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嘉靖为什么不杀海瑞｜Vibe知识大赏 v2</title><style>html,body{margin:0;background:#050403;color:#eee7d8;height:100%;display:grid;place-items:center;font-family:Georgia,'Songti SC',serif}.frame{position:relative;width:min(100vw,540px);aspect-ratio:9/16;background:#0b0a08;overflow:hidden;box-shadow:0 0 70px #000}.frame canvas{width:100%;height:100%;display:block}.ui{position:fixed;bottom:18px;display:flex;gap:8px}.ui button{background:#17130e;border:1px solid #8f7443;color:#d7bf88;padding:8px 14px;border-radius:3px}</style><div class="frame"><canvas id="c" width="1080" height="1920"></canvas></div><div class="ui"><button id="p">播放 / 暂停</button><button id="r">重新开始</button></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=c.width,H=c.height;const G='#c9a35b',R='#c7433b',I='#eee7d8',M='#9d9486';let t=0,run=false,last=0;const seg=[[0,4],[4,8],[8,11],[11,14],[14,19],[19,26],[26,33],[33,40],[40,43],[43,45]];function ease(z){return z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2}function txt(s,y,size,color=I,weight='400'){x.font=`${weight} ${size}px 'Songti SC',Georgia,serif`;x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.fillText(s,W/2,y)}function line(s,y,size,color=I){txt(s,y,size,color,'400')}function frameBg(){x.fillStyle='#0b0a08';x.fillRect(0,0,W,H);let g=x.createRadialGradient(W/2,420,0,W/2,900,1100);g.addColorStop(0,'#20180f');g.addColorStop(1,'#060504');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.1;for(let i=0;i<500;i++){x.fillStyle='#fff';x.fillRect((i*83)%W,(i*149)%H,1,1)}x.globalAlpha=1}function palace(y,alpha=1){x.save();x.globalAlpha=alpha;x.strokeStyle=G;x.lineWidth=3;x.beginPath();x.moveTo(150,y+160);x.lineTo(930,y+160);x.moveTo(220,y+160);x.lineTo(220,y);x.lineTo(860,y);x.lineTo(860,y+160);for(let px=260;px<860;px+=120){x.moveTo(px,y+20);x.lineTo(px,y+160)}x.moveTo(120,y+20);x.lineTo(960,y+20);x.stroke();x.restore()}function scroll(y,rot=0,scale=1){x.save();x.translate(W/2,y);x.rotate(rot);x.scale(scale,scale);x.fillStyle='#cfa66a';x.shadowColor='#d9a34d';x.shadowBlur=22;x.fillRect(-310,-145,620,290);x.shadowBlur=0;x.strokeStyle='#5e3c1d';x.lineWidth=8;x.strokeRect(-310,-145,620,290);line('《治安疏》',0,55,'#25180e');x.restore()}function caption(s){x.fillStyle='#d8c7a2';x.font="34px 'Songti SC',Georgia,serif";x.textAlign='center';x.fillText(s,W/2,1750)}function goldLine(a,b,c,d,alpha=1,w=2){x.save();x.globalAlpha=alpha;x.strokeStyle=G;x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();x.restore()}
function dust(q,count=90,seed=0){x.save();for(let k=0;k<count;k++){let px=(k*97+seed*31)%W, py=(k*173+seed*47)%H;let drift=Math.sin(q*5+k)*18;let a=.08+.14*((k*13)%10)/10;x.globalAlpha=a;x.fillStyle=k%5===0?R:'#e8d5a5';x.beginPath();x.arc((px+drift+W)%W,(py-q*38*(k%3+1)+H*2)%H,1+(k%3),0,Math.PI*2);x.fill()}x.restore()}
function vignette(){let g=x.createRadialGradient(W/2,H*.42,180,W/2,H*.5,980);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=g;x.fillRect(0,0,W,H)}
function dragon(cx,cy,scale,alpha,q){x.save();x.translate(cx,cy);x.scale(scale,scale);x.globalAlpha=alpha;x.strokeStyle=G;x.lineWidth=5;x.lineCap='round';x.beginPath();for(let k=0;k<4;k++){let off=k*52+Math.sin(q*3+k)*10;x.moveTo(-360+off,-100+k*60);x.bezierCurveTo(-190+off,-230+k*45,90+off,160+k*30,370+off,-40+k*65)}x.stroke();x.beginPath();x.arc(230,-80,42,0,Math.PI*2);x.stroke();x.fillStyle=R;x.beginPath();x.arc(250,-92,7,0,Math.PI*2);x.fill();x.restore()}
function palaceVector(q){x.save();let sway=Math.sin(q*2)*10; x.translate(sway,0);x.fillStyle='#15100b';x.fillRect(0,0,W,H);for(let layer=0;layer<3;layer++){let y=420+layer*230;let a=.25+layer*.14;x.globalAlpha=a;x.strokeStyle=G;x.lineWidth=8-layer*2;x.beginPath();x.moveTo(90,y+170);x.lineTo(990,y+170);x.moveTo(180,y+170);x.lineTo(180,y);x.lineTo(900,y);x.lineTo(900,y+170);for(let k=0;k<8;k++){let px=220+k*90;x.moveTo(px,y+30);x.lineTo(px,y+170)}x.stroke();}dragon(W/2,820,1.08,.14,q);x.fillStyle='#24190e';x.fillRect(310,1110,460,280);x.fillStyle='#090705';x.fillRect(410,1030,260,180);x.fillStyle=G;x.fillRect(425,1040,230,9);x.restore()}
function scroll(y,rot=0,scale=1,q=0){x.save();x.translate(W/2+Math.sin(q*4)*65,y+Math.sin(q*6)*26);x.rotate(rot+Math.sin(q*3)*.05);x.scale(scale,scale);x.shadowColor='rgba(214,157,70,.65)';x.shadowBlur=28;x.fillStyle='#cda565';x.fillRect(-310,-145,620,290);x.shadowBlur=0;x.strokeStyle='#5e3c1d';x.lineWidth=8;x.strokeRect(-310,-145,620,290);x.fillStyle='rgba(80,45,20,.15)';for(let k=0;k<7;k++)x.fillRect(-285,-105+k*34,570,3);x.font="900 55px 'Songti SC',Georgia,serif";x.fillStyle='#2b1b0d';x.textAlign='center';x.textBaseline='middle';x.fillText('《治安疏》',0,-2);x.restore()}
function drawArt(q){palaceVector(q);dust(q,120,2);let z=1+q*.08; x.save();x.globalAlpha=.45; x.translate(W/2,H*.55);x.scale(z,z);x.strokeStyle='rgba(201,163,91,.18)';x.lineWidth=16;x.beginPath();x.arc(0,0,300,0,Math.PI*2);x.stroke();x.restore();vignette()}
function drawPrison(q){x.save();x.fillStyle='#0a0908';x.fillRect(0,0,W,H);let glow=x.createRadialGradient(W/2,700,20,W/2,800,720);glow.addColorStop(0,'rgba(145,91,42,.28)');glow.addColorStop(1,'rgba(0,0,0,.8)');x.fillStyle=glow;x.fillRect(0,0,W,H);x.globalAlpha=.28;dragon(W/2,700,1.05,1,q);x.globalAlpha=.8;x.strokeStyle=G;x.lineWidth=10;for(let k=-4;k<=4;k++){let xx=180+k*180+Math.sin(q*4+k)*12;x.beginPath();x.moveTo(xx,420);x.lineTo(xx+80,1600);x.stroke()}x.globalAlpha=1;let slide=Math.sin(q*Math.PI)*100;x.fillStyle='rgba(5,4,3,.45)';x.fillRect(0,0,W,H);x.fillStyle='rgba(208,166,92,.18)';x.fillRect(0,1070+slide,W,10);dust(q,140,8);vignette();x.restore()}
function goldText(s,y,size,q,alpha=1){x.save();x.globalAlpha=alpha;x.font=`900 ${size}px 'Songti SC',Georgia,serif`;x.textAlign='center';x.textBaseline='middle';let g=x.createLinearGradient(W/2-size*2,y-size,W/2+size*2,y+size);g.addColorStop(0,'#8a5b1f');g.addColorStop(.28,'#f5d98b');g.addColorStop(.52,'#fff0b2');g.addColorStop(.78,'#c58b32');g.addColorStop(1,'#6c4217');x.fillStyle=g;x.shadowColor='rgba(241,190,82,.85)';x.shadowBlur=18+Math.sin(q*Math.PI)*14;let sc=1+(.14*Math.sin(q*Math.PI));x.translate(W/2,y);x.scale(sc,sc);x.fillText(s,0,0);x.restore()}
function palaceReveal(q){x.save();let y=H*1.02-(q*q)*760;x.globalAlpha=.18+.82*q;x.strokeStyle=G;x.lineWidth=6;x.beginPath();x.moveTo(80,y+300);x.lineTo(1000,y+300);x.moveTo(155,y+300);x.lineTo(155,y);x.lineTo(925,y);x.lineTo(925,y+300);for(let k=0;k<9;k++){let xx=190+k*86;x.moveTo(xx,y+34);x.lineTo(xx,y+300)}x.stroke();x.fillStyle='rgba(188,139,57,.15)';x.fillRect(170,y+260,740,58);x.restore()}
function corridor(q){x.save();let vanX=W/2,vanY=760;for(let k=0;k<8;k++){let yy=vanY+k*150+q*90;let spread=90+k*120;x.globalAlpha=.16+.04*k;x.strokeStyle=k%2?G:R;x.lineWidth=3;x.beginPath();x.moveTo(vanX-spread,yy);x.lineTo(vanX+spread,yy);x.stroke()}for(let k=0;k<6;k++){let off=110+k*150;goldLine(vanX,vanY,vanX-off,H,0.25,4);goldLine(vanX,vanY,vanX+off,H,0.25,4)}x.restore()}
function flyingMemorial(q,travel=0){let xPos=W/2+travel*(q-.5)*W*.85;let yPos=1060-q*500;x.save();x.translate(xPos,yPos);x.rotate(Math.sin(q*4)*.035);x.scale(1+q*.42,1+q*.42);x.shadowColor='rgba(229,170,70,.8)';x.shadowBlur=28;x.fillStyle='#cda565';x.fillRect(-315,-148,630,296);x.shadowBlur=0;x.strokeStyle='#5e3c1d';x.lineWidth=8;x.strokeRect(-315,-148,630,296);x.fillStyle='rgba(77,46,22,.16)';for(let k=0;k<7;k++)x.fillRect(-288,-108+k*34,575,3);x.font="900 55px 'Songti SC',Georgia,serif";x.fillStyle='#2b1b0d';x.textAlign='center';x.textBaseline='middle';x.fillText('治安疏',0,0);x.restore()}
function titleBurst(q){let p=Math.min(1,q);x.save();for(let k=0;k<42;k++){let a=k*.79+p*5,rr=p*760+(k%5)*25,sz=5+(k%4)*3;x.globalAlpha=(1-p)*.9;x.fillStyle=k%3===0?R:G;x.translate(W/2+Math.cos(a)*rr,1030+Math.sin(a)*rr);x.rotate(a);x.fillRect(-sz/2,-sz/2,sz*2,sz);x.setTransform(1,0,0,1,0,0)}x.restore()}
function drawScene(i,q){frameBg();dust(q,70,i*9);if(i===0){x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,W,H);goldText('核弹来了！',850,116,q,.35+.65*q);line('VIBE KNOWLEDGE / 01',1160,25,M)}if(i===1){goldText('核弹来了！',850,116,q,.25+.75*q);x.globalAlpha=.32+.3*q;goldLine(180,1020,900,1020,1,3);x.globalAlpha=1;line('重音落下，画面再次被击穿',1190,32,M)}if(i===2){palaceReveal(q);dragon(W/2,690,1.1,.16+.18*q,q);let reveal=Math.min(1,q*1.35);flyingMemorial(reveal,0);line('一封奏疏，飞入皇宫',1500,38,M)}if(i===3){palaceVector(q*.4);goldText('核弹来了！',690,106,1-q,.95);goldText('核弹来了！',880,106,1-q,.95);flyingMemorial(q*.8,0);titleBurst(q);if(q>.35){x.globalAlpha=(q-.35)*1.3;x.strokeStyle=R;x.lineWidth=7;x.beginPath();x.arc(W/2,800,220+q*430,0,Math.PI*2);x.stroke();x.globalAlpha=1}}if(i===4){palaceVector(q*.7);corridor(q);flyingMemorial(q,1);let z=1+q*.25;x.save();x.globalAlpha=.18+.15*q;x.translate(W/2,850);x.scale(z,z);x.strokeStyle=G;x.lineWidth=6;x.beginPath();x.arc(0,0,310,0,Math.PI*2);x.stroke();x.restore();line('镜头跟随奏疏，穿过宫门',1510,38,M)}if(i===5){txt('他说中了现实',760,86,G,'900');x.fillStyle='#15120e';x.fillRect(170,940,740,300);for(let k=0;k<7;k++){x.fillStyle=k%2?G:'#795c37';x.fillRect(220+k*90,1160-k*35,48,70+k*35)}line('嘉靖看完奏疏后，承认：句句是实。',1490,34)}if(i===6){txt('忠臣、直臣不能杀',720,72,R,'900');x.strokeStyle=R;x.lineWidth=5;x.beginPath();x.moveTo(180,1200);x.lineTo(900,1200);x.stroke();x.strokeRect(280,920,520,280);line('杀人容易，但会引发朝堂动荡，民怨沸腾。',1490,32)}if(i===7){txt('关押比处死更有利',700,78,G,'900');x.strokeStyle=G;x.lineWidth=5;x.beginPath();x.moveTo(160,1050);x.lineTo(920,1050);x.moveTo(540,1050);x.lineTo(540,1200);x.stroke();x.font='170px Georgia';x.fillStyle=G;x.fillText('⚖',W/2-85,1000);line('惩罚、隔离，又不制造政治符号',1490,34)}if(i===8){txt('历史与电视剧',650,72,G,'900');x.strokeStyle=M;x.lineWidth=2;x.beginPath();x.moveTo(540,760);x.lineTo(540,1350);x.stroke();line('剧作有加工',1010,44);line('史实有边界',1120,44);line('嘉靖把海瑞关进大狱，直到嘉靖去世后才获释。',1490,30)}if(i===9){txt('杀掉说真话的人，',790,75,I,'900');txt('代价可能比听他说完更大。',910,75,G,'900');for(let k=0;k<8;k++){x.strokeStyle=G;x.lineWidth=5;x.beginPath();x.moveTo(220+k*90,1130);x.lineTo(220+k*90,1370);x.stroke()}}x.fillStyle=M;x.font='22px Georgia';x.textAlign='left';x.fillText('嘉靖与海瑞',70,1840);x.textAlign='right';x.fillText(`00:${String(Math.floor(t)).padStart(2,'0')} / 00:45`,1010,1840)}function loop(now){if(!last)last=now;if(run){t+=(now-last)/1000;if(t>=45){t=45;run=false}}last=now;let i=seg.findIndex(a=>t>=a[0]&&t<a[1]);if(i<0)i=9;let q=(t-seg[i][0])/(seg[i][1]-seg[i][0]);drawScene(i,ease(Math.max(0,Math.min(1,q))));requestAnimationFrame(loop)}document.querySelector('#p').onclick=()=>{run=!run;last=performance.now()};document.querySelector('#r').onclick=()=>{t=0;run=true;last=performance.now()};requestAnimationFrame(loop)
</script></html>
